<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Subtitle settings</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px 16px 16px;
      font: 13px/1.4 system-ui, sans-serif;
      color: #1f1f1f;
      background: #fff;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
    }
    label {
      display: block;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    output {
      color: #5f6368;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%;
      margin: 0;
    }
    .check {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .check input {
      margin: 2px 0 0;
    }
    small {
      display: block;
      color: #5f6368;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    button {
      padding: 4px 10px;
      font: inherit;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e8eaed; background: #202124; }
      output, small { color: #9aa0a6; }
    }
  </style>
</head>
<body>
  <h1>Selectable Subtitles</h1>
  <label>
    <span class="row">Text size <output id="fontScaleValue"></output></span>
    <input type="range" id="fontScale" min="0.5" max="2" step="0.05">
  </label>
  <label>
    <span class="row">Background <output id="backgroundOpacityValue"></output></span>
    <input type="range" id="backgroundOpacity" min="0" max="1" step="0.05">
  </label>
  <label class="check">
    <input type="checkbox" id="holdBetweenSentences">
    <span>Hold phrase during pauses
      <small>Otherwise the phrase disappears shortly after its last word</small>
    </span>
  </label>
  <div class="buttons">
    <button id="resetPosition" type="button">Reset position</button>
    <button id="reset" type="button">Reset all</button>
  </div>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
